name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: astrbot_plugin_douyin
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: astrbot_plugin_douyin

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            astrbot_plugin_douyin/requirements.txt
            astrbot_plugin_douyin/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Load pinned public AstrBot Web API fixture
        run: |
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"]) / "astrbot-public-web.py"
          url = "https://raw.githubusercontent.com/AstrBotDevs/AstrBot/a412146401426c0cdff8bbefb8627a03da519da8/astrbot/api/web.py"
          with urllib.request.urlopen(url, timeout=30) as response:
              target.write_bytes(response.read())
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"ASTRBOT_PUBLIC_WEB_SOURCE={target}\n")
          PY

      - name: Lint and syntax
        run: |
          ruff check .
          ruff format --check .
          node --input-type=module --check < pages/manager/app.js

      - name: Test offline browser, Page and service flows
        run: |
          python -m pytest tests -q --basetemp "$RUNNER_TEMP/douyin-tests" -o cache_dir="$RUNNER_TEMP/douyin-pytest-cache" --junitxml="$RUNNER_TEMP/douyin-tests.xml"

  browser-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: astrbot_plugin_douyin
      - name: Verify installation in a clean Linux container
        run: |
          mkdir -p "$RUNNER_TEMP/douyin-bootstrap"
          docker run --rm --init \
            -w /app \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE/astrbot_plugin_douyin:/app/astrbot_plugin_douyin:ro" \
            -v "$RUNNER_TEMP/douyin-bootstrap:/data" \
            python:3.12-slim-bookworm sh -c \
            'python -m pip install -r /app/astrbot_plugin_douyin/requirements.txt && python -m astrbot_plugin_douyin.tests.runtime_smoke --data-dir /data --expect-install --expect-system-deps'
